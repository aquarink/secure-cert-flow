<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar | Secure Cert Flow - TailAdmin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex items-center justify-center p-4">

  <div x-data="authRegister()" class="w-full max-w-md bg-gray-800/90 border border-gray-700/80 rounded-2xl shadow-2xl p-8 backdrop-blur">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 shadow-lg shadow-indigo-600/30 text-white mb-4">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg>
      </div>
      <h2 class="text-2xl font-bold text-white tracking-tight">Daftar Akun Panitia</h2>
      <p class="text-sm text-gray-400 mt-1">Buat akun untuk mengelola sertifikat acara</p>
    </div>

    <!-- Error Alert -->
    <div x-show="errorMessage" x-cloak class="mb-4 p-3 rounded-lg bg-red-900/50 border border-red-700 text-red-200 text-sm flex items-center space-x-2">
      <svg class="w-5 h-5 flex-shrink-0 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      <span x-text="errorMessage"></span>
    </div>

    <!-- Success Alert -->
    <div x-show="successMessage" x-cloak class="mb-4 p-3 rounded-lg bg-emerald-900/50 border border-emerald-700 text-emerald-200 text-sm flex items-center space-x-2">
      <svg class="w-5 h-5 flex-shrink-0 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
      <span x-text="successMessage"></span>
    </div>

    <form @submit.prevent="submitRegister()" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2">Nama Lengkap</label>
        <input type="text" x-model="fullName" required placeholder="Dr. John Doe / Panitia Seminar" class="w-full px-4 py-2.5 rounded-xl bg-gray-900 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2">Email</label>
        <input type="email" x-model="email" required placeholder="panitia@acara.id" class="w-full px-4 py-2.5 rounded-xl bg-gray-900 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2">Password</label>
        <input type="password" x-model="password" minlength="6" required placeholder="Minimal 6 karakter" class="w-full px-4 py-2.5 rounded-xl bg-gray-900 border border-gray-700 text-white placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition">
      </div>

      <button type="submit" :disabled="loading" class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 text-white font-semibold shadow-lg shadow-indigo-600/30 transition flex items-center justify-center space-x-2 mt-6">
        <template x-if="loading">
          <svg class="animate-spin h-5 w-5 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        </template>
        <span x-text="loading ? 'Mendaftarkan...' : 'Daftar Sekarang'"></span>
      </button>
    </form>

    <div class="mt-6 text-center text-sm text-gray-400">
      Sudah punya akun? <a href="/login" class="text-indigo-400 hover:underline font-medium">Masuk disini</a>
    </div>
  </div>

  <script>
    function authRegister() {
      return {
        fullName: '',
        email: '',
        password: '',
        loading: false,
        errorMessage: '',
        successMessage: '',
        async submitRegister() {
          this.loading = true;
          this.errorMessage = '';
          this.successMessage = '';
          try {
            const res = await fetch('/api/v1/auth/register', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                full_name: this.fullName,
                email: this.email,
                password: this.password
              })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Pendaftaran gagal.');

            this.successMessage = 'Pendaftaran berhasil! Mengalihkan ke halaman login...';
            setTimeout(() => {
              window.location.href = '/login';
            }, 1500);
          } catch (err) {
            this.errorMessage = err.message;
          } finally {
            this.loading = false;
          }
        }
      }
    }
  </script>
</body>
</html>
